<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تغيير كلمة السر — InkSpire</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth-page"><div class="auth-card card"><h1>كلمة سر جديدة</h1><div id="msg"></div><form id="form"><label>كلمة السر الجديدة</label><input id="password" type="password" minlength="8" required><label>تأكيد كلمة السر</label><input id="confirm" type="password" required><button class="btn-primary btn-lg" type="submit" style="margin-top:16px">حفظ</button></form></div></main><script src="/supabase-client.js"></script><script>form.onsubmit=async e=>{e.preventDefault();if(password.value.length<8||!/[A-Z]/.test(password.value)||!/[0-9]/.test(password.value))return msg.innerHTML='<div class="form-error">خاصها 8 أحرف، حرف كبير ورقم.</div>';if(password.value!==confirm.value)return msg.innerHTML='<div class="form-error">ما متطابقاش.</div>';const {error}=await supabaseClient.auth.updateUser({password:password.value});if(error)return msg.innerHTML='<div class="form-error">'+error.message+'</div>';msg.innerHTML='<div class="form-success">تبدلات كلمة السر. غادي نمشيو للدخول.</div>';setTimeout(()=>location.href="/login.html",1200)}</script></body></html>
