<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جارٍ تسجيل الدخول — InkSpire</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth-page"><div class="auth-card card"><h1>جارٍ تسجيل الدخول...</h1><p id="msg" class="muted">يتم إكمال تسجيل الدخول، المرجو الانتظار.</p></div></main><script src="/supabase-client.js"></script><script>(async()=>{try{const p=new URLSearchParams(location.search);const error=p.get("error_description")||p.get("error");if(error){msg.textContent="تعذر تسجيل الدخول عبر Google: "+decodeURIComponent(error);return}const r=await supabaseClient.auth.getSession();if(r.data.session){const plan=sessionStorage.getItem("pending-checkout-plan");if(plan==="pro"||plan==="business"){sessionStorage.removeItem("pending-checkout-plan");const checkout=await supabaseClient.functions.invoke("create-checkout-session",{body:{plan:plan,success_url:location.origin+"/billing.html?payment=success",cancel_url:location.origin+"/pricing.html?payment=canceled"}});if(!checkout.error&&checkout.data&&checkout.data.url){location.replace(checkout.data.url);return}sessionStorage.setItem("pending-checkout-plan",plan);msg.textContent="تم تسجيل الدخول، ولكن تعذر فتح صفحة الدفع. يمكنك العودة إلى الأسعار والمحاولة مرة أخرى.";return}location.replace("/dashboard.html");return}msg.textContent="لم يتم إنشاء جلسة دخول. المرجو العودة إلى تسجيل الدخول والمحاولة مرة أخرى."}catch(e){msg.textContent="حدث خطأ أثناء تسجيل الدخول: "+(e&&e.message?e.message:String(e))}})();</script></body></html>
