<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جارٍ تسجيل الدخول — InkSpire</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth-page"><div class="auth-card card"><h1>جارٍ تسجيل الدخول...</h1><p id="msg" class="muted">يتم إكمال تسجيل الدخول، المرجو الانتظار.</p></div></main><script src="/supabase-client.js"></script><script>(async()=>{try{const p=new URLSearchParams(location.search);const code=p.get("code");const error=p.get("error_description")||p.get("error");if(error){msg.textContent="تعذر تسجيل الدخول عبر Google: "+decodeURIComponent(error);return}if(code){const r=await supabaseClient.auth.exchangeCodeForSession(code);if(r.error){msg.textContent="تعذر إنشاء جلسة الدخول: "+r.error.message;return}}const r=await supabaseClient.auth.getSession();if(r.data.session){location.replace("/dashboard.html");return}msg.textContent="لم يتم إنشاء جلسة دخول. المرجو العودة إلى تسجيل الدخول والمحاولة مرة أخرى."}catch(e){msg.textContent="حدث خطأ أثناء تسجيل الدخول: "+(e&&e.message?e.message:String(e))}})();</script></body></html>
