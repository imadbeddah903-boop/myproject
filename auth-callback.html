<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جارٍ تسجيل الدخول — InkSpire</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth-page"><div class="auth-card card"><h1>جارٍ تسجيل الدخول...</h1><p id="msg" class="muted">يتم تأكيد حساب Google، المرجو الانتظار.</p></div></main><script src="/supabase-client.js"></script><script>(async()=>{const code=new URLSearchParams(location.search).get("code");if(code){const {error}=await supabaseClient.auth.exchangeCodeForSession(code);if(error){msg.textContent="تعذر إكمال تسجيل الدخول: "+error.message;return}}const {data:{session}}=await supabaseClient.auth.getSession();if(session){location.replace("/dashboard.html")}else{location.replace("/login.html")}})();</script></body></html>
