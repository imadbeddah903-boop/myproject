<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المشروع — InkSpire</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="container project-page"><header class="project-header"><a href="/dashboard.html">← مشاريعي</a><div class="project-title-wrap"><span class="page-kicker">PROJECT</span><h1 id="title">...</h1></div><button id="delete" class="btn-danger">حذف</button></header><div id="loading" class="loading">جارٍ تحميل المشروع...</div><div id="error" class="error-box" style="display:none"></div><div id="content" style="display:none"><section id="progress" class="card" style="display:none;margin-bottom:24px"><h3 id="progress-title"></h3><div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div><p id="progress-status" class="muted"></p></section><section><div class="section-header"><h2>المشاهد (<span id="scene-count">0</span>)</h2><button id="generate-scenes" class="btn-secondary">توليد المشاهد</button></div><div id="scenes" class="scenes-grid"></div></section><section id="render-section" style="display:none;margin-top:24px"><button id="render" class="btn-primary btn-lg">🎬 تصيير الفيديو</button></section><section id="video-section" style="display:none;margin-top:24px"><div class="card"><h2>الفيديو النهائي</h2><video id="video" class="video-player" controls playsinline></video><div class="video-actions"><a id="download" class="btn-primary" download>⬇️ تنزيل الفيديو</a><button id="rerender" class="btn-secondary">🔄 إعادة التصيير</button></div></div></section></div></main><script src="/supabase-client.js"></script><script src="/auth.js"></script><script src="/toast.js"></script><script src="/project.js"></script></body></html>
