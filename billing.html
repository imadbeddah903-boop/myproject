<!doctype html><html lang="ar" dir="rtl"><head><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5696801491218521" crossorigin="anonymous"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفواتير والاشتراك — InkSpire</title><link rel="stylesheet" href="/styles.css"></head><body><main class="container billing-page"><a href="/dashboard.html">← Dashboard</a><h1>الفواتير والاشتراك</h1><section><h2>الخطة الحالية: <span id="plan-name">Free</span></h2><p id="plan-status"></p><a href="/pricing.html">ترقى</a> <button id="manage-subscription">إدارة الاشتراك</button></section><section><h2>الاستخدام</h2><div class="usage-bar"><div id="usage-fill" style="width:0%"></div></div><p id="usage-text">0 / 3 فيديو</p></section><section><h2>الفواتير</h2><div id="invoices-list">جاري التحميل…</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-client.js"></script><script>var LIMITS={free:3,pro:30,business:200,enterprise:999999999};async function init(){var u=await supabaseClient.auth.getUser();if(!u.data.user){location.href="/signup.html?redirect=billing";return;}var uid=u.data.user.id;var r=await Promise.all([supabaseClient.from("subscriptions").select("plan,status,current_period_end,cancel_at_period_end").eq("user_id",uid).maybeSingle(),supabaseClient.from("usage").select("videos_count,month").eq("user_id",uid).eq("month",new Date().toISOString().slice(0,7)).maybeSingle(),supabaseClient.from("invoices").select("amount_cents,currency,status,hosted_invoice_url,pdf_url,paid_at").eq("user_id",uid).order("paid_at",{ascending:false})]);var sub=r[0].data,usage=r[1].data,invoices=r[2].data||[],plan=sub&&sub.plan||"free",limit=LIMITS[plan]||3,used=usage&&usage.videos_count||0;document.getElementById("plan-name").textContent=plan;document.getElementById("plan-status").textContent=sub&&sub.status||"active";document.getElementById("usage-text").textContent=used+" / "+limit+" فيديو";document.getElementById("usage-fill").style.width=Math.min(100,used/limit*100)+"%";document.getElementById("invoices-list").innerHTML=invoices.map(function(i){return "<p>"+new Date(i.paid_at).toLocaleDateString("ar-MA")+" — "+(i.amount_cents/100).toFixed(2)+" "+String(i.currency).toUpperCase()+" — "+i.status+(i.hosted_invoice_url?" <a href=\""+i.hosted_invoice_url+"\" target=\"_blank\" rel=\"noopener\">عرض</a>":"")+"</p>";}).join("")||"ما كايناش فواتير بعد.";}document.getElementById("manage-subscription").onclick=async function(){var r=await supabaseClient.functions.invoke("customer-portal");if(r.error||!r.data||!r.data.url){alert("Stripe Customer Portal مازال ما تفعلاش.");return;}location.href=r.data.url;};init();</script></body></html>
