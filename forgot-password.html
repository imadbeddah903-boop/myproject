<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استرجاع كلمة السر — InkSpire</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth-page"><div class="auth-card card"><h1>نسيت كلمة السر؟</h1><div id="msg"></div><form id="form"><label>البريد الإلكتروني</label><input id="email" type="email" required><button class="btn-primary btn-lg" type="submit" style="margin-top:16px">إرسال رابط الاسترجاع</button></form><p style="margin-top:16px"><a href="/login.html">رجوع للدخول</a></p></div></main><script src="/supabase-client.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const {error}=await supabaseClient.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+"/reset-password.html"});msg.innerHTML=error?'<div class="form-error">'+error.message+'</div>':'<div class="form-success">إلا كان البريد مسجل، غادي يوصلك رابط الاسترجاع.</div>'}</script></body></html>
