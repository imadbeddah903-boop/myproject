<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InkSpire - AI Image Generator</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f7f9fc;
    }

    .container {
      width: 100%;
      max-width: 620px;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    }

    h1 {
      margin: 0 0 8px;
      color: #4f46e5;
    }

    .description {
      color: #6b7280;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-weight: bold;
    }

    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .field {
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      min-height: 20px;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #374151;
    }

    .result {
      margin-top: 20px;
      text-align: center;
    }

    #resultImage {
      display: none;
      width: 100%;
      max-width: 100%;
      border-radius: 14px;
    }

    #downloadLink {
      display: none;
      margin-top: 12px;
      color: #4f46e5;
      font-weight: bold;
      text-decoration: none;
    }

    .small {
      margin-top: 18px;
      color: #9ca3af;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>✨ InkSpire AI</h1>

    <p class="description">
      ولّد صوراً بالذكاء الاصطناعي انطلاقاً من وصفك.
    </p>

    <div class="field">
      <label for="prompt">وصف الصورة</label>

      <textarea
        id="prompt"
        placeholder="مثال: مدينة مستقبلية عند الغروب، إضاءة سينمائية، تفاصيل عالية..."
      ></textarea>
    </div>

    <div class="field">
      <label for="size">حجم الصورة</label>

      <select id="size">
        <option value="1024x1024">
          1024 × 1024
        </option>
      </select>
    </div>

    <button id="generateBtn">
      🎨 توليد الصورة
    </button>

    <div
      class="status"
      id="status"
      aria-live="polite"
    >
      جاهز للتوليد.
    </div>

    <div class="result">

      <img
        id="resultImage"
        alt="الصورة المولدة بواسطة InkSpire AI"
      >

      <br>

      <a
        id="downloadLink"
        href="#"
        download="inkspire-ai.png"
      >
        ⬇️ حفظ الصورة
      </a>

    </div>

    <p class="small">
      🔒 مفتاح الـAPI السري لا يوجد داخل الواجهة.
      التوليد يتم عبر Supabase Edge Function.
    </p>

  </main>

  <script>

    // Supabase
    const supabaseUrl =
      "https://oqhfvtdsagjktexwxbpl.supabase.co";

    const supabaseKey =
      "sb_publishable_bCHLZuGNNuxs3mhzsjLa5A_ZJqwtmlW";

    const supabaseClient =
      window.supabase.createClient(
        supabaseUrl,
        supabaseKey
      );


    // عناصر الصفحة
    const promptEl =
      document.getElementById("prompt");

    const sizeEl =
      document.getElementById("size");

    const generateBtn =
      document.getElementById("generateBtn");

    const statusEl =
      document.getElementById("status");

    const resultImage =
      document.getElementById("resultImage");

    const downloadLink =
      document.getElementById("downloadLink");


    // توليد الصورة
    generateBtn.addEventListener(
      "click",
      async () => {

        const prompt =
          promptEl.value.trim();


        // التحقق من الوصف
        if (prompt.length < 3) {

          statusEl.textContent =
            "⚠️ كتب وصف للصورة أولاً.";

          return;
        }


        // حالة التحميل
        generateBtn.disabled = true;

        statusEl.textContent =
          "⏳ جاري توليد الصورة...";

        resultImage.style.display =
          "none";

        downloadLink.style.display =
          "none";


        try {

          const {
            data,
            error
          } =
            await supabaseClient
              .functions
              .invoke(
                "generate-image",
                {
                  body: {
                    prompt: prompt,
                    size: sizeEl.value
                  }
                }
              );


          if (error) {
            throw error;
          }


          if (data?.error) {
            throw new Error(data.error);
          }


          // Base64 image
          if (data?.image_base64) {

            const imageUrl =
              "data:image/png;base64," +
              data.image_base64;

            resultImage.src =
              imageUrl;

            downloadLink.href =
              imageUrl;

          }


          // URL image
          else if (data?.image_url) {

            resultImage.src =
              data.image_url;

            downloadLink.href =
              data.image_url;

          }


          // لا توجد صورة
          else {

            throw new Error(
              "لم يتم إرجاع صورة من الخادم."
            );

          }


          // عرض النتيجة
          resultImage.style.display =
            "block";

          downloadLink.style.display =
            "inline-block";

          statusEl.textContent =
            "✅ تم توليد الصورة بنجاح!";

        }


        catch (error) {

          console.error(error);

          statusEl.textContent =
            "❌ " +
            (
              error?.message ||
              "فشل توليد الصورة."
            );

        }


        finally {

          generateBtn.disabled =
            false;

        }

      }
    );

  </script>

</body>
</html>
