<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InkSpire — مشروع جديد</title><link rel="stylesheet" href="/styles.css?v=20260926"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="app-shell"><header class="topbar app-topbar"><div class="brand"><a href="/dashboard.html" class="brand-mark">✨</a><a href="/dashboard.html" class="brand-name">InkSpire</a></div><nav class="top-actions"><span id="credits-pill" class="credits-pill">⚡ — / 50</span><a href="/dashboard.html">مشاريعي</a></nav></header><main class="container create-page"><div class="create-layout"><section class="card create-card"><div class="page-kicker">AI VIDEO STUDIO</div><h1>شنو باغي تصنع؟</h1><p class="muted">دخل الفكرة ديالك وخلي InkSpire يبني المشروع والمشاهد.</p><form id="form"><label for="topic">الفكرة</label><textarea id="topic" maxlength="500" required placeholder="مثال: كيف تعمل الطاقة الشمسية؟"></textarea><div class="field-row muted"><span><span id="count">0</span> / 500</span><a href="/templates.html">استعمل قالباً جاهزاً</a></div><label for="duration">المدة</label><select id="duration"><option value="30">30 ثانية</option><option value="60" selected>60 ثانية</option><option value="90">90 ثانية</option></select><label for="style">الأسلوب</label><select id="style"><option value="informative">تعليمي</option><option value="casual">سردي</option><option value="professional">احترافي</option></select><button id="submit" class="btn-primary btn-lg" type="submit">🎬 إنشاء المشروع</button></form><div id="progress" style="display:none;margin-top:20px"><div class="progress-bar"><div id="fill" class="progress-fill"></div></div><p id="status" class="muted"></p></div><div id="error" class="error-box" style="display:none"></div></section><aside class="card create-side"><span class="page-kicker">QUICK START</span><h3>باش تبدا بسرعة</h3><div class="quick-item">✦ اختار فكرة واضحة</div><div class="quick-item">🎞️ غادي يتولدوا المشاهد</div><div class="quick-item">🖼️ ولّد صور كل مشهد</div><div class="quick-item">🎬 صَيّر الفيديو وصدّرو</div></aside></div></main><script src="/supabase-client.js"></script><script src="/auth.js"></script><script>let user;const form=document.getElementById("form"),topic=document.getElementById("topic"),count=document.getElementById("count"),duration=document.getElementById("duration"),style=document.getElementById("style"),submit=document.getElementById("submit"),progress=document.getElementById("progress"),fill=document.getElementById("fill"),status=document.getElementById("status"),error=document.getElementById("error"),creditsPill=document.getElementById("credits-pill");async function init(){user=await requireAuth();if(!user)return;const {data:p}=await supabaseClient.from("profiles").select("credits").eq("id",user.id).maybeSingle();creditsPill.textContent="⚡ "+Math.max(0,Number(p?.credits??0))+" / 50";const tpl=JSON.parse(localStorage.getItem("inkspire-template")||"null");if(tpl){topic.value=tpl.topic||"";style.value=tpl.style||"informative";count.textContent=topic.value.length;localStorage.removeItem("inkspire-template")}topic.oninput=()=>count.textContent=topic.value.length;form.onsubmit=submitForm}async function submitForm(e){e.preventDefault();const t=topic.value.trim();if(t.length<5)return showErr("يرجى إدخال فكرة أوضح.");submit.disabled=true;form.style.display="none";progress.style.display="block";fill.style.width="25%";status.textContent="جارٍ إنشاء المشروع...";const {data:p,error:e1}=await supabaseClient.from("projects").insert({user_id:user.id,title:t,prompt:t,language:"Arabic",style:style.value,status:"generating"}).select().single();if(e1){return fail(e1.message)}localStorage.setItem("project-"+p.id+"-config",JSON.stringify({topic:t,duration:parseInt(duration.value),style:style.value}));fill.style.width="100%";status.textContent="تم إنشاء المشروع.";location.href="/project.html?id="+p.id}function fail(m){showErr(m);form.style.display="block";progress.style.display="none";submit.disabled=false}function showErr(m){error.textContent=m;error.style.display="block"}init();</script></body></html>
