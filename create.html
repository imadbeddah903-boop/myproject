<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فيديو جديد — InkSpire</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="topbar"><div class="logo"><a href="/">✨ InkSpire</a></div><nav><span id="credits-pill" class="credits-pill">⚡ — / 50</span><a href="/dashboard.html">← مشاريعي</a></nav></header><main class="container create-page"><div class="card"><div class="page-kicker">AI VIDEO STUDIO</div><h1>فيديو جديد</h1><p class="muted">اكتب فكرتك، ثم اضبط المدة والأسلوب لإنشاء مشروع جديد.</p><form id="form"><label>الموضوع</label><textarea id="topic" maxlength="500" required placeholder="مثال: كيف تعمل الطاقة الشمسية؟"></textarea><div class="muted"><span id="count">0</span> / 500</div><label>المدة</label><select id="duration"><option value="30">30 ثانية</option><option value="60" selected>60 ثانية</option><option value="90">90 ثانية</option></select><label>الأسلوب</label><select id="style"><option value="informative">تعليمي</option><option value="casual">سردي</option><option value="professional">احترافي</option></select><button id="submit" class="btn-primary btn-lg" type="submit" style="margin-top:18px">🎬 إنشاء المشروع</button></form><div id="progress" style="display:none;margin-top:20px"><div class="progress-bar"><div id="fill" class="progress-fill"></div></div><p id="status" class="muted"></p></div><div id="error" class="error-box" style="display:none"></div></div></main><script src="/supabase-client.js"></script><script src="/auth.js"></script><script>let user;init();async function init(){user=await requireAuth();if(!user)return;topic.oninput=()=>count.textContent=topic.value.length;form.onsubmit=submitForm}async function submitForm(e){e.preventDefault();const t=topic.value.trim();if(t.length<5)return showErr("يرجى إدخال موضوع أو فكرة أوضح.");submit.disabled=true;form.style.display="none";progress.style.display="block";fill.style.width="10%";status.textContent="جارٍ إنشاء المشروع...";const {data:p,error}=await supabaseClient.from("projects").insert({user_id:user.id,title:t,prompt:t,language:"Arabic",style:style.value,status:"generating"}).select().single();if(error){showErr(error.message);form.style.display="block";progress.style.display="none";submit.disabled=false;return}localStorage.setItem("project-"+p.id+"-config",JSON.stringify({topic:t,duration:parseInt(duration.value),style:style.value}));fill.style.width="20%";status.textContent="جارٍ فتح مساحة المشروع...";location.href="/project.html?id="+p.id}function showErr(m){error.textContent=m;error.style.display="block"}</script></body></html>
