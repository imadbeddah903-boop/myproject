<!doctype html><html lang="ar" dir="rtl"><head><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5696801491218521" crossorigin="anonymous"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب — InkSpire</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth-page"><div class="auth-card card"><h1>إنشاء حساب</h1><p class="muted">أنشئ حسابك في InkSpire باستخدام Google.</p><div id="msg"></div><button id="googleBtn" class="btn-google" type="button"><img src="https://www.google.com/favicon.ico" width="18" height="18" alt="Google">المتابعة باستخدام Google</button><p style="margin-top:18px;text-align:center" class="muted">لا تحتاج إلى إدخال بريد إلكتروني أو كلمة مرور يدوياً. سيستخدم InkSpire حساب Google الخاص بك للمصادقة.</p><p style="margin-top:16px;text-align:center" class="muted">لديك حساب بالفعل؟ <a href="/login.html">تسجيل الدخول باستخدام Google</a></p></div></main><script src="/supabase-client.js"></script><script src="/auth.js"></script><script>
const params=new URLSearchParams(location.search);
const selectedPlan=params.get("plan");
const validPlan=selectedPlan==="pro"||selectedPlan==="business";
if(validPlan) sessionStorage.setItem("pending-checkout-plan",selectedPlan);

async function continueToCheckout(plan){
  msg.textContent="يتم تجهيز الاشتراك...";
  googleBtn.disabled=true;
  const checkout=await supabaseClient.functions.invoke("create-checkout-session",{
    body:{
      plan,
      success_url:location.origin+"/billing.html?payment=success",
      cancel_url:location.origin+"/pricing.html?payment=canceled"
    }
  });
  const checkoutUrl=checkout?.data?.url||checkout?.data?.checkout_url;
  if(!checkout.error&&typeof checkoutUrl==="string"&&/^https:\/\/checkout\.stripe\.com\//.test(checkoutUrl)){
    sessionStorage.removeItem("pending-checkout-plan");
    window.location.href=checkoutUrl;
    return;
  }
  googleBtn.disabled=false;
  const detail=checkout?.data?.error||checkout?.error?.message||"تعذر إنشاء جلسة الدفع.";
  msg.innerHTML='<div class="form-error">تعذر فتح صفحة الدفع: '+String(detail).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;","\"":"&quot;"}[c]))+'</div>';
}
(async()=>{
  const r=await supabaseClient.auth.getSession();
  if(r.data.session&&validPlan) await continueToCheckout(selectedPlan);
})();
</script><script>googleBtn.onclick=async()=>{
  msg.innerHTML="";
  const plan=sessionStorage.getItem("pending-checkout-plan");
  if(plan==="pro"||plan==="business"){
    const current=await supabaseClient.auth.getSession();
    if(current.data.session){ await continueToCheckout(plan); return; }
  }
  googleBtn.disabled=true;
  const {error}=await supabaseClient.auth.signInWithOAuth({
    provider:"google",
    options:{redirectTo:location.origin+"/auth-callback.html"}
  });
  if(error){
    googleBtn.disabled=false;
    msg.innerHTML='<div class="form-error">'+translateError(error.message)+'</div>';
  }
}</script><script src="/analytics.js"></script><script src="/sentry.js"></script></body></html>
