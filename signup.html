<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل جديد — InkSpire</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth-page"><div class="auth-card card"><h1>إنشاء حساب</h1><p class="muted">بدا مع InkSpire.</p><div id="msg"></div><form id="form"><label>الاسم الكامل</label><input id="name" required maxlength="80"><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة السر</label><input id="password" type="password" minlength="8" required><div class="password-strength"><span id="strength"></span></div><small id="strengthText" class="muted"></small><label>تأكيد كلمة السر</label><input id="confirm" type="password" required><label><input id="terms" type="checkbox" style="width:auto"> كنوافق على الشروط</label><button id="submit" class="btn-primary btn-lg" type="submit" style="margin-top:16px">إنشاء الحساب</button></form><p style="margin-top:16px" class="muted">عندك حساب؟ <a href="/login.html">دخل</a></p></div></main><script src="/supabase-client.js"></script><script src="/auth.js"></script><script>const p=document.getElementById("password"),s=document.getElementById("strength"),st=document.getElementById("strengthText");function strength(v){let n=0;if(v.length>=8)n++;if(v.length>=12)n++;if(/[a-z]/.test(v))n++;if(/[A-Z]/.test(v))n++;if(/[0-9]/.test(v))n++;if(/[^A-Za-z0-9]/.test(v))n++;return n}p.oninput=()=>{const n=strength(p.value);s.style.width=Math.min(100,n/6*100)+"%";st.textContent=n<=2?"ضعيفة":n<=4?"متوسطة":"قوية"};form.onsubmit=async e=>{e.preventDefault();msg.innerHTML="";const name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim(),pass=p.value,confirm=document.getElementById("confirm").value;if(!name)return msg.innerHTML='<div class="form-error">دخل الاسم.</div>';if(pass.length<8||!/[A-Z]/.test(pass)||!/[0-9]/.test(pass))return msg.innerHTML='<div class="form-error">كلمة السر خاصها 8 أحرف على الأقل وفيها حرف كبير ورقم.</div>';if(pass!==confirm)return msg.innerHTML='<div class="form-error">كلمتا السر ما متطابقاش.</div>';if(!document.getElementById("terms").checked)return msg.innerHTML='<div class="form-error">خاصك توافق على الشروط.</div>';submit.disabled=true;const {data,error}=await supabaseClient.auth.signUp({email,password:pass,options:{data:{full_name:name},emailRedirectTo:location.origin+"/dashboard.html"}});submit.disabled=false;if(error)return msg.innerHTML='<div class="form-error">'+translateError(error.message)+'</div>';if(data.user)msg.innerHTML='<div class="form-success">تم التسجيل. تفقد البريد الإلكتروني للتأكيد، ومن بعد دخل للحساب.</div>'}</script></body></html>
