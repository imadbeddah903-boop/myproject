<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب — InkSpire</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth-page"><div class="auth-card card"><h1>إنشاء حساب</h1><p class="muted">أنشئ حسابك في InkSpire باستخدام Google.</p><div id="msg"></div><button id="googleBtn" class="btn-google" type="button"><img src="https://www.google.com/favicon.ico" width="18" height="18" alt="Google">المتابعة باستخدام Google</button><p style="margin-top:18px;text-align:center" class="muted">لا تحتاج إلى إدخال بريد إلكتروني أو كلمة مرور يدوياً. سيستخدم InkSpire حساب Google الخاص بك للمصادقة.</p><p style="margin-top:16px;text-align:center" class="muted">لديك حساب بالفعل؟ <a href="/login.html">تسجيل الدخول باستخدام Google</a></p></div></main><script src="/supabase-client.js"></script><script src="/auth.js"></script><script>googleBtn.onclick=async()=>{msg.innerHTML="";googleBtn.disabled=true;const {error}=await supabaseClient.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+"/dashboard.html"}});if(error){googleBtn.disabled=false;msg.innerHTML='<div class="form-error">'+translateError(error.message)+'</div>'}}</script></body></html>
