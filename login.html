<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول — InkSpire</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth-page"><div class="auth-card card"><h1>تسجيل الدخول</h1><div id="msg"></div><form id="form"><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة السر</label><input id="password" type="password" required><p style="margin:10px 0"><a href="/forgot-password.html">نسيت كلمة السر؟</a></p><button id="submit" class="btn-primary btn-lg" type="submit">دخول</button></form><p style="margin-top:16px" class="muted">ليس لديك حساب؟ <a href="/signup.html">إنشاء حساب</a></p></div></main><script src="/supabase-client.js"></script><script src="/auth.js"></script><script>(async()=>{const r=new URLSearchParams(location.search);if(r.get("reason")==="unverified")msg.innerHTML='<div class="form-error">يرجى تأكيد البريد الإلكتروني أولاً.</div>'})();form.onsubmit=async e=>{e.preventDefault();msg.innerHTML="";submit.disabled=true;const {data,error}=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:password.value});submit.disabled=false;if(error)return msg.innerHTML='<div class="form-error">'+translateError(error.message)+'</div>';if(!data.user.email_confirmed_at){await supabaseClient.auth.signOut();return msg.innerHTML='<div class="form-error">أكد البريد الإلكتروني قبل الدخول.</div>'}location.href="/dashboard.html"}</script></body></html>
