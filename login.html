<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول — InkSpire</title><link rel="stylesheet" href="/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="auth-page"><div class="auth-card card"><h1>تسجيل الدخول</h1><p class="muted">استخدم حساب Google للوصول إلى InkSpire بسرعة وأمان.</p><div id="msg"></div><button id="googleBtn" class="btn-google" type="button"><img src="https://www.google.com/favicon.ico" width="18" height="18" alt="Google">الدخول بحساب Google</button><p style="margin-top:18px;text-align:center" class="muted">سيتم التحقق من حسابك عبر Google، ولا تحتاج إلى إنشاء كلمة مرور لـ InkSpire.</p><p style="margin-top:16px;text-align:center" class="muted">ليس لديك حساب؟ <a href="/signup.html">إنشاء حساب باستخدام Google</a></p></div></main><script src="/supabase-client.js"></script><script src="/auth.js"></script><script>googleBtn.onclick=async()=>{msg.innerHTML="";googleBtn.disabled=true;const {error}=await supabaseClient.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+"/dashboard.html"}});if(error){googleBtn.disabled=false;msg.innerHTML='<div class="form-error">'+translateError(error.message)+'</div>'}}</script></body></html>
