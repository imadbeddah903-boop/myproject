<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دليل محلي — المغرب</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f7f7f5;color:#171717}main{max-width:900px;margin:auto;padding:32px 18px}.hero{background:#fff;border-radius:24px;padding:28px;box-shadow:0 8px 30px #0000000d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:20px}.card{background:#fff;padding:18px;border-radius:18px;border:1px solid #e8e8e8}.btn{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:12px;background:#111;color:#fff;text-decoration:none}</style></head><body><main><section class="hero"><p>دليل محلي متخصص</p><h1>اكتشف الأماكن والتجارب المحلية</h1><p>نسخة MVP لدليل رقمي لمنطقة واحدة: أماكن، أنشطة، خدمات، خريطة ومعلومات للزوار.</p><a class="btn" href="#places">استكشف</a></section><section id="places" class="grid"><div class="card"><h3>أماكن مميزة</h3><p>أماكن طبيعية ومعالم محلية.</p></div><div class="card"><h3>أنشطة</h3><p>تجارب يمكن للزائر حجزها أو التواصل حولها.</p></div><div class="card"><h3>خدمات محلية</h3><p>إقامات، مطاعم، نقل وخدمات سياحية.</p></div></section></main></body></html>
