<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وصف المنتجات — المغرب</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f7fb;color:#161616}main{max-width:850px;margin:auto;padding:28px 16px}.box{background:#fff;padding:24px;border-radius:22px;box-shadow:0 8px 28px #0000000b}textarea,input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:12px;font:inherit}button{padding:12px 18px;border:0;border-radius:12px;background:#111;color:#fff}.out{white-space:pre-wrap;background:#f3f3f3;padding:16px;border-radius:14px;margin-top:16px}</style></head><body><main><div class="box"><h1>مولّد وصف المنتجات</h1><p>MVP مستقل للتاجر: أدخل معلومات المنتج وأنشئ مسودة وصف بالعربية والفرنسية ومنشور WhatsApp.</p><label>اسم المنتج</label><input id="name" placeholder="مثال: حقيبة جلدية"><label>الثمن</label><input id="price" placeholder="199 DH"><label>معلومات المنتج</label><textarea id="info" rows="5" placeholder="الخامة، المقاس، المميزات..."></textarea><button onclick="generate()">إنشاء المسودة</button><div id="out" class="out" hidden></div></div></main><script>function generate(){var n=document.getElementById('name').value||'المنتج',p=document.getElementById('price').value||'',i=document.getElementById('info').value||'';document.getElementById('out').hidden=false;document.getElementById('out').textContent='العربية:\n'+n+' — '+p+'\n'+i+'\nاطلب الآن عبر WhatsApp.\n\nFrançais:\n'+n+' — '+p+'\n'+i+'\nContactez-nous sur WhatsApp.';}</script></body></html>
